<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Héra · Test utilisateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --foret:#1F3A2E; --sauge:#8FAE9B; --paper:#FAF8F3; --carte:#FFFFFF;
  --encre:#22271F; --muet:#6E7568; --ligne:#E4E0D5; --alerte:#B0653F; --ok:#4E7D63; --or:#C9A15A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--encre);font-size:16px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 16px}
.logo{font-family:'Fraunces',serif;font-weight:650;font-size:24px;color:var(--foret)}
.badge{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muet)}
.progress{position:sticky;top:0;background:var(--paper);padding:8px 0 12px;z-index:5}
.bar{height:5px;background:var(--ligne);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--foret);border-radius:3px;transition:width .3s ease}
.bar-label{font-size:12px;color:var(--muet);margin-top:5px;display:flex;justify-content:space-between}
h1{font-family:'Fraunces',serif;font-weight:650;font-size:26px;color:var(--foret);line-height:1.2;margin:10px 0 6px}
h2{font-family:'Fraunces',serif;font-weight:650;font-size:21px;color:var(--foret);margin:0 0 4px}
h3{font-family:'Fraunces',serif;font-weight:650;font-size:16.5px;margin-bottom:2px}
a{color:var(--foret)}
.section-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--alerte);margin-bottom:6px}
.intro-time{font-size:13px;color:var(--muet);margin-bottom:14px}
p{margin-bottom:12px}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:18px;margin-bottom:14px}
.q{margin-bottom:20px}
.q-label{font-weight:600;margin-bottom:8px;display:block}
.q-hint{font-size:13px;color:var(--muet);margin:-4px 0 8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{border:1.5px solid var(--ligne);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--carte);
  font-size:15px;transition:border-color .12s,background .12s;display:flex;align-items:center;gap:10px;user-select:none}
.opt:hover{border-color:var(--sauge)}
.opt.sel{border-color:var(--foret);background:#EFF4F0;font-weight:600}
.opt input{accent-color:var(--foret);width:16px;height:16px;flex:none;pointer-events:none}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:11px 0;border:1.5px solid var(--ligne);background:var(--carte);border-radius:10px;
  font-size:16px;font-weight:600;cursor:pointer;color:var(--encre);transition:background .12s,border-color .12s}
.scale button:hover{border-color:var(--sauge)}
.scale button.sel{background:var(--foret);border-color:var(--foret);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muet);margin-top:4px}
.scale.nps{flex-wrap:wrap}
.scale.nps button{flex:0 0 auto;width:calc((100% - 40px)/11);min-width:38px;padding:10px 0}
textarea,input[type=text],input[type=email]{width:100%;border:1.5px solid var(--ligne);border-radius:10px;
  padding:11px 13px;font:inherit;font-size:15px;background:var(--carte);color:var(--encre)}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--foret)}
.btn{display:inline-block;background:var(--foret);color:#fff;border:none;border-radius:99px;
  padding:14px 30px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--foret);border:1.5px solid var(--foret)}
.btn.big{width:100%;padding:16px;font-size:17px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}
.feature-card{border-left:4px solid var(--sauge);padding-left:14px;margin-bottom:24px}
.feature-card .fdesc{font-size:13.5px;color:var(--muet);margin-bottom:10px}
.notes{background:#F2EFE6;border-radius:10px;padding:14px;font-size:14px;margin:14px 0}
.notes > b{display:block;margin-bottom:6px}
.notes li{margin-left:18px;margin-bottom:4px}
.checkout{background:var(--foret);border-radius:14px;padding:22px;color:#fff;text-align:center;margin:10px 0 16px}
.checkout .kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sauge)}
.checkout .prix{font-family:'Fraunces',serif;font-size:42px;font-weight:650;color:var(--or)}
.checkout .desc{color:#DCE6DE;font-size:14px;margin:6px 0 16px}
.checkout .cta{display:flex;flex-direction:column;gap:8px}
.checkout .btn{background:var(--or);color:var(--foret)}
.checkout .btn.ghost{background:transparent;color:#DCE6DE;border-color:#587A68}
.reveal{background:#EFF4F0;border:1.5px solid var(--ok);border-radius:10px;padding:12px 14px;font-size:14px;margin:10px 0 18px}
#quit-btn{position:fixed;bottom:18px;right:18px;z-index:50;background:var(--carte);border:1.5px solid var(--alerte);
  color:var(--alerte);border-radius:99px;padding:11px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 3px 14px rgba(40,40,30,.18)}
#quit-btn:hover{background:var(--alerte);color:#fff}
#quit-modal{position:fixed;inset:0;background:rgba(20,25,20,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
#quit-modal.open{display:flex}
#quit-modal .card{max-width:440px;width:100%;margin:0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--foret);color:#fff;
  padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:70}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:480px){.wrap{padding:14px 14px 120px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">Héra</span>
    <span class="badge">Test utilisateur · <span id="save-state">brouillon local</span></span>
  </header>
  <div class="progress">
    <div class="bar"><i id="bar-fill" style="width:0%"></i></div>
    <div class="bar-label"><span id="bar-step">Bienvenue</span><span id="bar-pct">0 %</span></div>
  </div>
  <main id="app"></main>
</div>

<button id="quit-btn" title="En usage réel, je serais parti ici">🚪 J’aurais quitté ici</button>

<div id="quit-modal"><div class="card" style="max-height:88vh;overflow-y:auto">
  <h2 style="margin-bottom:8px">Vous seriez parti ici ?</h2>
  <p style="font-size:14px;color:var(--muet)">C’est la donnée la plus précieuse du test. Dites-nous où et pourquoi, puis le test continue normalement.</p>
  <span class="q-label">À quelle étape de l’app ?</span>
  <div class="opts" id="quit-steps"></div>
  <span class="q-label" style="margin-top:16px">Et pourquoi ?</span>
  <textarea id="quit-reason" placeholder="Trop lent / je ne comprends pas quoi faire / le rendu ne me plaît pas / …"></textarea>
  <div class="nav">
    <button class="btn ghost" data-act="quit-close">Annuler</button>
    <button class="btn" data-act="quit-save">Enregistrer</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════ CONFIG ═══════════════ */
const APP_URL = "https://foyer-omega.vercel.app";
const SUPABASE_URL = "https://vflgjfbbkzyqeydzaaoc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmbGdqZmJia3p5cWV5ZHphYW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDU1MjYsImV4cCI6MjA5NjU4MTUyNn0.4sB1Csb7tJaaFnwKPqbA7gaHTQrrAkTz5OE5XdAlVac";
// Prix unique, pas de cellule A/B : on ne cherche pas l’élasticité, on cherche
// qui sort sa carte — c’est l’engagement qui prédit le panier, pas les 2 €.
const PRIX_PACK = 4.99;
/* ══════════════════════════════════════ */

const params = new URLSearchParams(location.search);
const S = { session_id: null, sid_app: params.get("sid") || null, data: {}, exits: [], step: 0 };

try {
  const draft = JSON.parse(localStorage.getItem("foyer_test") || "null");
  if (draft && draft.session_id) Object.assign(S, draft);
} catch (e) { /* brouillon illisible : on repart à zéro */ }

if (!S.session_id) S.session_id = "ut_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const eur = (n) => n.toFixed(2).replace(".", ",") + " €";
const LIBELLE_PAY = { pack: "prendre le pack", expert: "passer Expert", stop: "je m’arrête là" };

/* ─────────── état & sauvegarde ─────────── */
const setSave = (t) => { document.getElementById("save-state").textContent = t; };
const toast = (t) => {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
};

// La table user_test est fermée à double tour en anon : ni lecture, ni écriture
// directe. On passe par le RPC save_user_test (SECURITY DEFINER), qui fait
// l’upsert et ne renvoie rien. Écrire sans jamais pouvoir lire : c’est ce qui
// empêche un testeur (la clé anon est publique) de lire les réponses des autres.
// Au passage, ni POST ?on_conflict= ni PATCH ne marcheraient ici : Postgres
// exige une policy SELECT pour voir les lignes à modifier, et un PATCH qui ne
// matche rien répond quand même 204 — l’échec serait donc silencieux.
const RPC = SUPABASE_URL + "/rest/v1/rpc/save_user_test";
const HEADERS = {
  "Content-Type": "application/json",
  apikey: SUPABASE_ANON_KEY,
  Authorization: "Bearer " + SUPABASE_ANON_KEY,
};

const save = (payload) =>
  fetch(RPC, { method: "POST", headers: HEADERS, body: JSON.stringify({ payload }) });

let pushT = null;
function pushRemote() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { setSave("brouillon local"); return; }
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    const profil = S.data.profil || {};
    const final = S.data.final || {};
    try {
      const r = await save({
        session_id: S.session_id,
        sid_app: S.sid_app,
        prenom: profil.prenom || null,
        nom: profil.nom || null,
        email: final.email || null,
        data: S.data,
        exits: S.exits,
        step_reached: "S" + S.step,
        updated_at: new Date().toISOString(),
      });
      setSave(r.ok ? "sauvegardé ✓" : "erreur de sauvegarde");
    } catch (e) {
      setSave("hors ligne — brouillon local");
    }
  }, 600);
}

function persist() {
  try { localStorage.setItem("foyer_test", JSON.stringify(S)); } catch (e) { /* quota / mode privé */ }
  pushRemote();
}

const get = (sec, k) => (S.data[sec] || {})[k];
function set(sec, k, v) {
  if (!S.data[sec]) S.data[sec] = {};
  S.data[sec][k] = v;
  persist();
}

/* ─────────── helpers de rendu ─────────── */
const esc = (s) => String(s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const attrs = (sec, k) => `data-sec="${esc(sec)}" data-k="${esc(k)}"`;

// Tout clic sur une option re-rend la section (scroll préservé) : c’est ce qui
// fait apparaître les questions conditionnelles au lieu de les laisser mortes.
function radio(sec, k, options, opts = {}) {
  const v = get(sec, k);
  const cls = "opts" + (opts.row ? " row" : "");
  return `<div class="${cls}">` + options.map((o) =>
    `<label class="opt${v === o ? " sel" : ""}" data-pick="radio" ${attrs(sec, k)} data-v="${esc(o)}">
      <input type="radio" ${v === o ? "checked" : ""}>${o}</label>`).join("") + `</div>`;
}

function checks(sec, k, options) {
  const v = get(sec, k) || [];
  return `<div class="opts">` + options.map((o) =>
    `<label class="opt${v.includes(o) ? " sel" : ""}" data-pick="check" ${attrs(sec, k)} data-v="${esc(o)}">
      <input type="checkbox" ${v.includes(o) ? "checked" : ""}>${o}</label>`).join("") + `</div>`;
}

// max <= 6 → échelle 1..max ; max = 10 → NPS 0..10
function scale(sec, k, max, lo, hi) {
  const v = get(sec, k);
  const nps = max > 6;
  const n = nps ? max + 1 : max;
  const btns = Array.from({ length: n }, (_, i) => {
    const val = nps ? i : i + 1;
    return `<button class="${v === val ? "sel" : ""}" data-pick="scale" ${attrs(sec, k)} data-v="${val}">${val}</button>`;
  }).join("");
  return `<div class="scale${nps ? " nps" : ""}">${btns}</div>
    <div class="scale-ends"><span>${lo}</span><span>${hi}</span></div>`;
}

function txt(sec, k, ph, area) {
  const v = get(sec, k) || "";
  return area
    ? `<textarea data-field ${attrs(sec, k)} placeholder="${esc(ph)}">${esc(v)}</textarea>`
    : `<input type="text" data-field ${attrs(sec, k)} placeholder="${esc(ph)}" value="${esc(v)}">`;
}

const q = (label, inner, hint) =>
  `<div class="q"><span class="q-label">${label}</span>${hint ? `<div class="q-hint">${hint}</div>` : ""}${inner}</div>`;

const nav = (prev, next, label) =>
  `<div class="nav">
    ${prev === null ? "<span></span>" : `<button class="btn ghost" data-act="go" data-step="${prev}">Retour</button>`}
    <button class="btn" data-act="go" data-step="${next}">${label || "Continuer"}</button>
  </div>`;

/* ═══════════════ SECTIONS ═══════════════ */
const SECTIONS = [

/* 0 */ { id: "accueil", bar: "Bienvenue", render: () => `
  <h1>Bienvenue, et merci d’être là 🌿</h1>
  <p>Vous allez tester <b>Héra</b>, une app qui transforme la photo d’une pièce en projet déco réaliste, avec les vrais meubles à acheter derrière. Comptez <b>~20 minutes</b> (+ 10 min de bonus si vous nous aimez vraiment).</p>

  <div class="card">
    <b>Le deal d’honnêteté 🤝</b>
    <p style="margin-top:8px">On ne cherche pas des compliments, on cherche <b>la vérité</b>. Si quelque chose est moche, lent ou incompréhensible, dites-le. C’est exactement pour ça qu’on vous a fait venir.</p>
    <p style="margin-bottom:0">Et surtout : à tout moment, si <i>en usage réel</i> vous seriez parti, cliquez le bouton <b>« 🚪 J’aurais quitté ici »</b> en bas à droite. C’est la donnée la plus précieuse du test, personne ne sera vexé. Promis.</p>
  </div>

  <div class="notes">
    <b>Trois choses à savoir avant de commencer :</b>
    <li>Tout est <b>gratuit et illimité</b> pendant la beta. Si un écran vous propose de payer, vous pouvez accepter : cela modélisera un paiement fictif.</li>
    <li>Un bug, un truc cassé ? Dites-le nous ici : la page, ce que vous attendiez, ce que vous avez eu. Une capture d’écran si vous l’avez.</li>
  </div>

  ${nav(null, 1, "C’est parti")}`
},

/* 1 */ { id: "libre", bar: "Exploration libre", render: () => `
  <div class="section-eyebrow">Étape 1 / 9 · ~8 min</div>
  <h2>À vous de jouer, sans guide</h2>

  <p>Ouvrez <a href="${APP_URL}/create" target="_blank" rel="noopener"><b>${APP_URL}/create</b></a> dans un autre onglet, et faites <b>votre salon</b>, comme si on n’était pas derrière votre épaule.</p>
  <p style="font-size:14px;color:var(--muet)">Pourquoi le salon ? C’est là que notre catalogue est le plus musclé : on a un faible pour les canapés. Pas d’inquiétude, juste après vous pourrez vous amuser avec les pièces que vous voulez, la chambre parentale avec dressing ou la salle de billard.</p>

  <div class="card">
    <b>La photo idéale 📸</b>
    <p style="margin:6px 0 0;font-size:14px">Cadrée large (un mur entier visible), en lumière naturelle, et sans vous dedans : Héra redécore les pièces, pas les gens.</p>
  </div>

  <p><b>Revenez ici quand votre salon est fini</b>, c’est à dire quand vous avez vu le rendu et sa liste de courses. Prenez 5 à 10 minutes.</p>

  ${q("Qu’avez-vous fait spontanément ?", checks("libre", "actions", [
    "Ajouté des contraintes avant le 1er rendu",
    "Parcouru plusieurs styles avant de choisir",
    "Lu la description d’un style (au survol)",
    "Cliqué sur 2 ou 3 produits de la liste de courses",
    "Relancé un rendu du même projet",
    "Créé un compte",
  ]), "Cochez tout ce qui est vrai, zéro jugement.")}

  ${q("Première impression, à chaud", scale("libre", "impression", 5, "Bof", "Waouh"))}

  ${q("Auriez-vous réalisé un panier d’achat ?", radio("libre", "panier", [
    "Oui", "Non",
  ], { row: true }))}
  ${get("libre", "panier") === "Oui" ? q("De l’ensemble des articles, ou d’une partie ?", radio("libre", "panier_part", [
    "De l’ensemble", "D’une partie",
  ], { row: true })) : ""}
  ${get("libre", "panier") === "Non" ? q("Qu’est-ce qui vous en a empêché ?", txt("libre", "panier_frein", "Dites-nous tout…", true)) : ""}

  ${q("C’est crédible ? (on dirait votre vraie pièce redécorée, pas un montage)", scale("libre", "credible", 5, "Montage flagrant", "Ma pièce, en mieux"))}
  ${q("C’est clair ? (vous saviez toujours quoi faire)", scale("libre", "clair", 5, "Perdu(e)", "Limpide"))}
  ${q("Où avez-vous hésité, ou failli abandonner ?", txt("libre", "hesitation", "L’écran, le moment, le pourquoi…", true))}

  ${nav(0, 2)}`
},

/* 2 */ { id: "guide", bar: "Visite guidée", render: () => {
  const manque = get("guide", "style_trouve") === "Non, il manque le mien";
  const pay = get("guide", "paywall");
  return `
  <div class="section-eyebrow">Étape 2 / 9 · ~7 min</div>
  <h2>Visite guidée : les recoins que vous avez peut-être ratés</h2>
  <p>Maintenant on vous tient la main (gentiment). <b>Repartez sur <a href="${APP_URL}/create" target="_blank" rel="noopener">${APP_URL}/create</a> et ré-uploadez la même photo</b> : ça crée un projet neuf, votre premier reste intact. Puis faites chaque mini-mission.</p>

  <div class="feature-card">
    <h3>🎨 Les styles</h3>
    <div class="fdesc">Sur l’écran « Quelle ambiance ? », survolez 3 ou 4 cartes pour lire les descriptions.</div>
    ${q("Vous avez trouvé un style qui VOUS ressemble ?", radio("guide", "style_trouve", [
      "Oui, pile le mien", "À peu près", "Non, il manque le mien",
    ], { row: true }))}
    ${manque ? q("Lequel manque ?", txt("guide", "style_manque", "Ex. japandi brut, maximalisme kitsch…")) : ""}
    ${q("Le rendu est-il fidèle au style choisi ?", scale("guide", "style_fidele", 5, "Aucun rapport", "Fidèle"))}
  </div>

  <div class="feature-card">
    <h3>🛋️ Garder, personnaliser, remplacer</h3>
    <div class="fdesc">Sur l’écran « Voici ce qu’on va faire », testez les trois options sur des meubles différents.</div>
    ${q("Votre pièce reste-t-elle la vôtre ? (murs, fenêtres, portes à leur place)", radio("guide", "piece_respectee", [
      "Oui, intacte", "Quelques libertés", "Ce n’était plus du tout la même",
    ], { row: true }))}
    ${q("Utilité de pouvoir garder ou personnaliser, au lieu de tout remplacer", scale("guide", "gpr_utile", 5, "Gadget", "Indispensable"))}
    ${q("Choisir meuble par meuble ce qu’on garde et ce qu’on remplace, ça vaut de l’argent ?", radio("guide", "gpr_payer", [
      "Oui, c’est ce qui fait la valeur du truc",
      "Non, ça doit être inclus de base",
      "Non, ça ne m’a rien apporté",
    ]))}
  </div>

  <div class="feature-card">
    <h3>🛒 La liste de courses</h3>
    <div class="fdesc">Ouvrez 2 ou 3 produits de votre liste.</div>
    ${q("Les produits proposés ressemblent-ils à ceux du rendu ?", scale("guide", "match", 5, "Rien à voir", "Quasi identiques"))}
    ${q("La liste vous fait gagner du temps, par rapport à chercher vous-même ?", scale("guide", "liste_temps", 5, "Non", "Énormément"))}
  </div>

  <div class="feature-card">
    <h3>🔁 Peaufiner le rendu</h3>
    <div class="fdesc">Sur l’écran du rendu, il y a « Affinez ». Relancez un ou deux ajustements sur des éléments qui ne vous plaisent pas.</div>
    ${q("Auriez-vous eu envie de continuer à itérer, de peaufiner encore ?", radio("guide", "iterer", [
      "Oui, j’aurais enchaîné plusieurs fois",
      "Une ou deux fois de plus, pas davantage",
      "Non, le premier rendu me suffisait",
    ]))}

    <p style="margin-top:16px"><b>C’est exactement là que ça deviendrait payant.</b> En usage réel, une fois vos rendus gratuits épuisés, cet écran apparaît. Répondez comme si c’était votre vrai argent (on sait, c’est plus dur).</p>

    <div class="checkout">

/* ═══════════════ ROUTEUR ═══════════════ */
const app = document.getElementById("app");
const LAST_MANDATORY = 9; // index de la dernière section obligatoire

function paint() {
  const sec = SECTIONS[S.step];
  app.innerHTML = sec.render();
  const pct = Math.min(100, Math.round((S.step / LAST_MANDATORY) * 100));
  document.getElementById("bar-fill").style.width = pct + "%";
  document.getElementById("bar-step").textContent = sec.bar;
  document.getElementById("bar-pct").textContent = pct + " %";
}

// Re-rendu sur place, sans bouger le scroll : sert aux questions conditionnelles.
function reload() {
  const y = window.scrollY;
  paint();
  window.scrollTo({ top: y });
}

function go(i) {
  S.step = i;
  persist();
  paint();
  window.scrollTo({ top: 0 });
}

function finish(fromBonus) {
  set("final", "termine", new Date().toISOString());
  const wantsBonus = (get("final", "optins") || []).some((o) => o.includes("10 minutes"));
  if (!fromBonus && wantsBonus) {
    go(10);
    toast("Vous avez coché le bonus, c’est parti pour 10 minutes de plus !");
  } else {
    go(11);
  }
}

/* ═══════════════ ÉVÉNEMENTS ═══════════════ */
document.addEventListener("click", (e) => {
  const etapeEl = e.target.closest("[data-quit-etape]");
  if (etapeEl) {
    quitEtape = etapeEl.dataset.quitEtape;
    renderQuitSteps();
    return;
  }

  const pickEl = e.target.closest("[data-pick]");
  if (pickEl) {
    const { pick, sec, k, v } = pickEl.dataset;
    if (pick === "radio") set(sec, k, v);
    else if (pick === "scale") set(sec, k, Number(v));
    else if (pick === "check") {
      const cur = get(sec, k) || [];
      set(sec, k, cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v]);
    }
    reload();
    return;
  }

  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  const act = actEl.dataset.act;

  if (act === "go") go(Number(actEl.dataset.step));
  else if (act === "finish") finish(actEl.dataset.fromBonus === "1");
  else if (act === "comment") envoyerCommentaire();
  else if (act === "restart") restart();
  else if (act === "quit-open") openQuit();
  else if (act === "quit-close") closeQuit();
  else if (act === "quit-save") logQuit();
});

// Texte libre : on enregistre à la frappe (persist est déjà debouncé côté réseau).
document.addEventListener("input", (e) => {
  const f = e.target.closest("[data-field]");
  if (f) set(f.dataset.sec, f.dataset.k, f.value);
});

document.getElementById("quit-btn").addEventListener("click", openQuit);

// Les étapes telles que le testeur les voit dans l’app (Photo → Style →
// Mobilier → Rendu → Projet), plus les écrans annexes. Le questionnaire sait
// déjà où on en est DANS le questionnaire : ce qu’on ignore, c’est où il aurait
// lâché dans L’APP. D’où cette question, sans laquelle la sortie n’est pas
// exploitable.
const ETAPES_APP = [
  "Le choix du type de pièce, ou l’upload de la photo",
  "Les contraintes (ce que je voulais garder)",
  "Le choix du style",
  "L’écran « Voici ce qu’on va faire » (le mobilier)",
  "L’attente pendant la génération",
  "La découverte du rendu",
  "La liste de courses",
  "Les 3 dispositions",
  "Le mode Expert",
  "Un écran de paiement",
  "Autre, ou je ne sais plus",
];

let quitEtape = null;

function renderQuitSteps() {
  document.getElementById("quit-steps").innerHTML = ETAPES_APP.map((e) =>
    `<label class="opt${quitEtape === e ? " sel" : ""}" data-quit-etape="${esc(e)}">
      <input type="radio" ${quitEtape === e ? "checked" : ""}>${e}</label>`).join("");
}

function openQuit() {
  quitEtape = null;
  renderQuitSteps();
  document.getElementById("quit-modal").classList.add("open");
}

function closeQuit() {
  document.getElementById("quit-modal").classList.remove("open");
}

function logQuit() {
  const el = document.getElementById("quit-reason");
  S.exits.push({
    step: "S" + S.step,
    section: SECTIONS[S.step].id,   // où il était dans le questionnaire
    etape_app: quitEtape,           // où il aurait lâché dans l’app
    t: new Date().toISOString(),
    raison: el.value || "",
  });
  el.value = "";
  quitEtape = null;
  closeQuit();
  persist();
  toast("Noté. Merci pour votre franchise, le test continue.");
}

// Repart d’un brouillon vierge : nouveau session_id, donc nouvelle ligne.
// Les réponses déjà envoyées restent en base, intactes.
function restart() {
  try { localStorage.removeItem("foyer_test"); } catch (e) { /* mode privé */ }
  location.reload();
}

// Commentaires libres APRÈS le questionnaire : le testeur continue d'explorer l'app,
// et chaque remarque part s'ajouter à la liste (on n'écrase pas la précédente). Le champ
// n'est PAS un data-field : celui-ci écrirait une chaîne là où on stocke un tableau.
function envoyerCommentaire() {
  const el = document.getElementById("free-comment");
  const v = (el.value || "").trim();
  if (!v) { toast("Écrivez d'abord un mot 🙂"); return; }
  const liste = get("merci", "commentaires") || [];
  set("merci", "commentaires", [...liste, { t: new Date().toISOString(), texte: v }]);
  reload();
  toast("Commentaire envoyé. Continuez à tester !");
}

paint();
</script>
